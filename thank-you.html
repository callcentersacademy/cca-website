<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Thank You | Call Centers Academy</title>
  <meta name="description" content="Thank you for reaching out to Call Centers Academy." />
  <meta name="robots" content="noindex, nofollow" />

  <!-- FAVICON -->
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='6' fill='%23253166'/><path d='M7 22 Q7 10 16 10 Q25 10 25 22' stroke='%2300A1DE' stroke-width='2.5' fill='none' stroke-linecap='round'/><line x1='7' y1='22' x2='25' y2='22' stroke='%23FFCC00' stroke-width='2.5' stroke-linecap='round'/><line x1='16' y1='10' x2='16' y2='8' stroke='%2300A1DE' stroke-width='2' stroke-linecap='round'/></svg>" />

  <!-- FONTS -->
  <link href="https://fonts.googleapis.com/css2?family=Josefin+Sans:wght@300;400;600;700&family=Playfair+Display:wght@700;900&display=swap" rel="stylesheet" />

  <!-- GTM -->
  <script>(function(w,d,s,l,i){w[l]=w[l]||[];w[l].push({'gtm.start':new Date().getTime(),event:'gtm.js'});var f=d.getElementsByTagName(s)[0],j=d.createElement(s),dl=l!='dataLayer'?'&l='+l:'';j.async=true;j.src='https://www.googletagmanager.com/gtm.js?id='+i+dl;f.parentNode.insertBefore(j,f);})(window,document,'script','dataLayer','GTM-MJXKFG2L');</script>

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --indigo: #253166;
      --sky: #00A1DE;
      --carmine: #CD171A;
      --yellow: #FFCC00;
      --white: #ffffff;
    }

    body {
      font-family: 'Josefin Sans', sans-serif;
      background: var(--indigo);
      color: var(--white);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 24px;
      text-align: center;
    }

    .container {
      max-width: 480px;
      width: 100%;
      animation: fadeUp 0.6s ease both;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(24px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .check-wrap {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 72px;
      height: 72px;
      border-radius: 50%;
      background: rgba(0,161,222,0.12);
      border: 2px solid rgba(0,161,222,0.3);
      margin-bottom: 28px;
      animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) both;
      animation-delay: 0.15s;
    }

    @keyframes popIn {
      from { opacity: 0; transform: scale(0.5); }
      to   { opacity: 1; transform: scale(1); }
    }

    .check-wrap svg path {
      stroke: var(--sky);
      stroke-width: 3;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: none;
      stroke-dasharray: 50;
      stroke-dashoffset: 50;
      animation: drawCheck 0.5s ease forwards;
      animation-delay: 0.4s;
    }

    @keyframes drawCheck {
      to { stroke-dashoffset: 0; }
    }

    .label {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--sky);
      margin-bottom: 12px;
    }

    h1 {
      font-family: 'Playfair Display', serif;
      font-size: clamp(28px, 6vw, 40px);
      font-weight: 900;
      line-height: 1.2;
      margin-bottom: 16px;
      color: var(--white);
    }

    h1 span { color: var(--yellow); }

    .divider {
      width: 36px;
      height: 3px;
      background: var(--yellow);
      border-radius: 2px;
      margin: 0 auto 20px;
    }

    p {
      font-size: 16px;
      font-weight: 300;
      color: rgba(255,255,255,0.65);
      line-height: 1.75;
      margin-bottom: 40px;
    }

    .buttons {
      display: flex;
      gap: 12px;
      justify-content: center;
      flex-wrap: wrap;
    }

    .btn {
      display: inline-block;
      padding: 12px 24px;
      border-radius: 6px;
      font-family: 'Josefin Sans', sans-serif;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      text-decoration: none;
      transition: transform 0.15s ease, opacity 0.15s ease;
      cursor: pointer;
      border: none;
    }

    .btn:hover { transform: translateY(-2px); opacity: 0.9; }

    .btn-primary {
      background: var(--yellow);
      color: var(--indigo);
    }

    .btn-secondary {
      background: rgba(255,255,255,0.1);
      color: var(--white);
      border: 1.5px solid rgba(255,255,255,0.25);
    }

    .footer-brand {
      margin-top: 48px;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.2);
    }

    <!-- COOKIE BANNER -->
    #cca-cookie-banner {
      position: fixed;
      bottom: 24px;
      left: 24px;
      z-index: 9999;
      max-width: 320px;
      background: var(--white);
      border-radius: 10px;
      padding: 18px 20px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.2);
      font-size: 13px;
      line-height: 1.55;
      display: flex;
      flex-direction: column;
      gap: 14px;
      transition: opacity 0.3s ease, transform 0.3s ease;
    }

    #cca-cookie-banner.hidden { opacity: 0; transform: translateY(10px); pointer-events: none; }
    #cca-cookie-banner p { margin: 0; color: #333; }
    #cca-cookie-banner a { color: var(--sky); text-decoration: underline; }

    .cookie-buttons { display: flex; gap: 8px; }

    .cookie-btn {
      flex: 1;
      padding: 8px 12px;
      border: none;
      border-radius: 5px;
      font-family: 'Josefin Sans', sans-serif;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      cursor: pointer;
      transition: opacity 0.15s;
    }

    .cookie-btn:hover { opacity: 0.85; }
    .cookie-btn.accept { background: var(--sky); color: var(--white); }
    .cookie-btn.decline { background: #e8e8e8; color: #555; }

    @media (max-width: 480px) {
      #cca-cookie-banner { left: 16px; right: 16px; max-width: none; bottom: 16px; }
      .buttons { flex-direction: column; align-items: center; }
      .btn { width: 100%; text-align: center; }
    }
  </style>
</head>
<body>

<noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-MJXKFG2L" height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript>

<div class="container">

  <div class="check-wrap">
    <svg width="32" height="32" viewBox="0 0 36 36" xmlns="http://www.w3.org/2000/svg">
      <path d="M6 18 L14 26 L30 10" />
    </svg>
  </div>

  <p class="label">Message received</p>

  <h1>Thank <span>you.</span></h1>

  <div class="divider"></div>

  <p>We got your message. We'll be in touch.</p>

  <div class="buttons">
    <a href="blog/index.html" class="btn btn-primary">Back to the blog</a>
    <a href="index.html" class="btn btn-secondary">Main site</a>
  </div>

  <p class="footer-brand">Call Centers Academy &amp; BPO &middot; Est. 2018 &middot; Santo Domingo, DR</p>

</div>

<!-- COOKIE BANNER -->
<div id="cca-cookie-banner" role="dialog" aria-label="Cookie consent">
  <p>We use cookies to understand how visitors use our site. See our <a href="privacy.html">Privacy Policy</a>.</p>
  <div class="cookie-buttons">
    <button class="cookie-btn decline" onclick="ccaDecline()">Decline</button>
    <button class="cookie-btn accept" onclick="ccaAccept()">Accept</button>
  </div>
</div>

<script>
  if (window.dataLayer) dataLayer.push({ event: 'form_submission_complete' });

  (function() {
    const c = localStorage.getItem('cca_cookie_consent');
    if (c) document.getElementById('cca-cookie-banner').classList.add('hidden');
  })();

  function ccaAccept() {
    localStorage.setItem('cca_cookie_consent', 'accepted');
    document.getElementById('cca-cookie-banner').classList.add('hidden');
    if (window.dataLayer) dataLayer.push({ event: 'cookie_consent_accepted' });
  }

  function ccaDecline() {
    localStorage.setItem('cca_cookie_consent', 'declined');
    document.getElementById('cca-cookie-banner').classList.add('hidden');
  }
</script>

</body>
</html>
