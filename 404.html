  <style>
    :root {
      --cca-indigo:     #253166;
      --cca-sky:        #00a1de;
      --cca-carmine:    #cd171a;
      --cca-yellow:     #ffcc00;
      --cca-dark:       #0a2a3f;
      --cca-light-gray: #f9fafb;
      --cca-gray:       #dedee2;
      --cca-white:      #ffffff;
      --font-brand:     'MuseoModerno', cursive;
      --font-body:      'Josefin Sans', sans-serif;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: var(--font-body);
      background-color: var(--cca-indigo);
      color: var(--cca-white);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 2rem;
      -webkit-font-smoothing: antialiased;
      overflow: hidden;
    }
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        radial-gradient(circle at 20% 50%, rgba(0,161,222,0.08) 0%, transparent 50%),
        radial-gradient(circle at 80% 20%, rgba(255,204,0,0.06) 0%, transparent 40%),
        radial-gradient(circle at 60% 80%, rgba(205,23,26,0.05) 0%, transparent 40%);
      pointer-events: none;
    }
    .container {
      position: relative;
      max-width: 560px;
      width: 100%;
      animation: fadeUp 0.6s ease both;
    }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(24px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .error-code {
      font-family: var(--font-brand);
      font-size: clamp(6rem, 20vw, 10rem);
      font-weight: 700;
      line-height: 1;
      color: var(--cca-white);
      opacity: 0.12;
      position: absolute;
      top: -2rem;
      left: 50%;
      transform: translateX(-50%);
      user-select: none;
      white-space: nowrap;
    }
    .icon {
      font-size: 3.5rem;
      margin-bottom: 1.25rem;
      display: block;
      animation: wiggle 2.5s ease-in-out infinite;
    }
    @keyframes wiggle {
      0%, 100% { transform: rotate(-4deg); }
      50%       { transform: rotate(4deg); }
    }
    h1 {
      font-family: var(--font-brand);
      font-size: clamp(1.6rem, 4vw, 2.2rem);
      font-weight: 600;
      margin-bottom: 0.75rem;
    }
    h1 span { color: var(--cca-yellow); }
    .divider {
      width: 40px; height: 3px;
      background: var(--cca-sky);
      border-radius: 2px;
      margin: 1.5rem auto;
    }
    p {
      font-size: 1rem;
      font-weight: 300;
      color: rgba(255,255,255,0.7);
      margin-bottom: 2rem;
      line-height: 1.7;
    }
    .cta-group {
      display: flex;
      gap: 0.75rem;
      justify-content: center;
      flex-wrap: wrap;
    }
    .btn {
      display: inline-block;
      padding: 0.75rem 1.75rem;
      border-radius: 8px;
      font-family: var(--font-body);
      font-size: 0.9rem;
      font-weight: 600;
      letter-spacing: 0.04em;
      text-decoration: none;
      text-transform: uppercase;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      cursor: pointer;
    }
    .btn:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(0,0,0,0.25); }
    .btn-primary { background: var(--cca-yellow); color: var(--cca-indigo); border: none; }
    .btn-secondary { background: transparent; color: var(--cca-white); border: 1.5px solid rgba(255,255,255,0.3); }
    .btn-secondary:hover { border-color: rgba(255,255,255,0.7); }
    .brand {
      margin-top: 3rem;
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.25);
    }

    /* Cookie Banner — white always */
    #cca-cookie-banner {
      position: fixed;
      bottom: 1.5rem;
      left: 1.5rem;
      z-index: 9999;
      max-width: 340px;
      background: var(--cca-white);
      color: #333;
      border-radius: 12px;
      padding: 1.1rem 1.25rem;
      box-shadow: 0 8px 32px rgba(0,0,0,0.18);
      font-size: 0.82rem;
      line-height: 1.55;
      display: flex;
      flex-direction: column;
      gap: 0.85rem;
      transition: opacity 0.35s ease, transform 0.35s ease;
      border: 1px solid var(--cca-gray);
    }
    #cca-cookie-banner.hidden { opacity: 0; transform: translateY(12px); pointer-events: none; }
    #cca-cookie-banner p { margin: 0; color: #333; }
    #cca-cookie-banner a { color: var(--cca-sky); text-decoration: underline; text-underline-offset: 2px; }
    #cca-cookie-banner a:hover { color: var(--cca-indigo); }
    .cca-cookie-buttons { display: flex; gap: 0.6rem; }
    .cca-cookie-btn {
      flex: 1;
      padding: 0.5rem 0.75rem;
      border: none;
      border-radius: 6px;
      font-family: var(--font-body);
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s ease, transform 0.15s ease;
    }
    .cca-cookie-btn:hover { transform: translateY(-1px); }
    .cca-cookie-btn.accept { background: var(--cca-sky); color: var(--cca-white); }
    .cca-cookie-btn.accept:hover { background: #0090c8; }
    .cca-cookie-btn.decline { background: var(--cca-gray); color: #555; }
    .cca-cookie-btn.decline:hover { background: #ccc; }
    @media (max-width: 480px) {
      #cca-cookie-banner { left: 1rem; right: 1rem; max-width: none; bottom: 1rem; }
    }

    <span class="icon">🎧</span>

    <p>This page doesn't exist — or maybe it moved.<br/>Either way, let's get you back on the line.</p>
    <div class="cta-group">
      <a href="/" class="btn btn-primary">Back to Home</a>
      <a href="/contact.html" class="btn btn-secondary">Contact Us</a>
    </div>
    <p class="brand">Call Centers Academy &amp; BPO · Est. 2018</p>
  </div>

  <div id="cca-cookie-banner" role="dialog" aria-label="Cookie consent">
    <p>We use cookies to understand how visitors use our site and improve your experience. See our <a href="/privacy.html">Privacy Policy</a> for details.</p>
    <div class="cca-cookie-buttons">
      <button class="cca-cookie-btn decline" onclick="ccaCookieDecline()">Decline</button>
      <button class="cca-cookie-btn accept" onclick="ccaCookieAccept()">Accept</button>
    </div>
  </div>

  <script>
    (function() {
      const c = localStorage.getItem('cca_cookie_consent');
      if (c === 'accepted' || c === 'declined') document.getElementById('cca-cookie-banner').classList.add('hidden');
    })();
    function ccaCookieAccept() {
      localStorage.setItem('cca_cookie_consent', 'accepted');
      document.getElementById('cca-cookie-banner').classList.add('hidden');
      if (window.dataLayer) dataLayer.push({ event: 'cookie_consent_accepted' });
    }
    function ccaCookieDecline() {
      localStorage.setItem('cca_cookie_consent', 'declined');
      document.getElementById('cca-cookie-banner').classList.add('hidden');
    }
  </script>
